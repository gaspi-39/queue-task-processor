services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=taskdb
      - POSTGRES_USER=taskuser
      - POSTGRES_PASSWORD=taskpass
    ports:
      # Host port 5433 to avoid clashing with a local PostgreSQL on 5432
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  rabbitmq:
    image: heidiks/rabbitmq-delayed-message-exchange:4.2.0-management
    ports:
      - "5672:5672"   # AMQP (lo usa la app)
      - "15672:15672" # UI de management (http://localhost:15672, guest/guest)

volumes:
  pg-data:
